# CI Pipeline — Agentic AI HTML5 Parser
#
# STATUS BADGE (add to README.md):
#   ![CI](https://github.com/Silvio777-hub/Agentic-HTML5-Parser/actions/workflows/ci.yml/badge.svg)
#   Replace <owner> and <repo> with your GitHub username and repository name.
#
# COVERAGE BADGE (requires codecov.io integration):
#   [![codecov](https://codecov.io/gh/Silvio777-hub/Agentic-HTML5-Parser/branch/main/graph/badge.svg)](https://codecov.io/gh/Silvio777-hub/Agentic-HTML5-Parser)

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.13']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: Tests on ${{ matrix.os }} / Python ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src/ --max-line-length=120 || true

      - name: Run unit & streaming tests with coverage
        run: pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        if: always()

      - name: Run adversarial robustness suite
        run: python scripts/run_adversarial.py

      - name: Run real-world historical website benchmark
        run: python scripts/eval_real_world_pages.py

      - name: Run compliance sample tests
        run: python scripts/run_compliance.py --sample
        continue-on-error: true

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-results
          path: data/compliance_results.json
        if: always()
