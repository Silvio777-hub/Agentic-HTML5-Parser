# CI Pipeline — Agentic AI HTML5 Parser
#
# STATUS BADGE (add to README.md):
#   ![CI](https://github.com/<owner>/<repo>/actions/workflows/ci.yml/badge.svg)
#   Replace <owner> and <repo> with your GitHub username and repository name.
#
# COVERAGE BADGE (requires codecov.io integration):
#   [![codecov](https://codecov.io/gh/<owner>/<repo>/branch/main/graph/badge.svg)](https://codecov.io/gh/<owner>/<repo>)

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src/ --max-line-length=120 || true

      - name: Run unit & streaming tests
        run: pytest tests/ -v --tb=short

      - name: Run adversarial robustness suite
        run: python scripts/run_adversarial.py

      - name: Run compliance sample tests
        run: python scripts/run_compliance.py --sample
        continue-on-error: true

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-results
          path: data/compliance_results.json
        if: always()
